name: VoiceCode

options:
  bundleIdPrefix: dev.910labs
  deploymentTarget:
    iOS: "18.5"
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 128
    IPHONEOS_DEPLOYMENT_TARGET: "18.5"
  configs:
    Debug:
      BuildIndependentTargetsInParallel: true
    Release:
      BuildIndependentTargetsInParallel: true

packages:
  # Kokoro neural voice for the iPhone and Mac apps (Apache-2.0). Pinned exactly: see
  # docs/design/kokoro-neural-voice.md before changing the version.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.3

targets:
  VoiceCode:
    type: application
    platform: iOS
    deploymentTarget: "18.5"
    supportedDestinations:
      - iOS
    sources:
      - path: VoiceCode
        excludes:
          - "*.md"
    resources:
      - VoiceCode/Assets.xcassets
      - VoiceCode/VoiceCode.xcdatamodeld
      - VoiceCode/PrivacyInfo.xcprivacy
    info:
      path: VoiceCode/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Untethered
        CFBundleIconName: AppIcon
        NSCameraUsageDescription: Untethered needs camera access to scan QR codes for API key authentication.
        NSMicrophoneUsageDescription: Untethered needs microphone access for voice input to control Claude.
        NSSpeechRecognitionUsageDescription: Untethered needs speech recognition to transcribe your voice commands.
        NSLocalNetworkUsageDescription: Untethered needs to connect to your backend server on your local network to send voice commands and receive Claude Code responses.
        NSBluetoothAlwaysUsageDescription: Untethered uses Bluetooth to connect to your BlueParrott headset for hands-free voice control.
        NSPrivacyPolicyURL: https://raw.githubusercontent.com/reifying/untethered/main/docs/privacy-policy.md
        UIBackgroundModes:
          - audio
          - bluetooth-central
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: VoiceCode/VoiceCode.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.910labs.untethered.resources
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.910labs.voice-code
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.910labs.voice-code
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: VoiceCode/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: VoiceCode/BridgingHeader.h
      configs:
        Debug:
          DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        Release:
          DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    preBuildScripts: []
    postBuildScripts:
      # FluidAudio's TTS trait bundles LuxTTS lexicon data that FluidAudio documents as derived
      # from espeak-ng (GPL-3.0-or-later). Kokoro never reads it, and it must not ship in this
      # MIT app: delete it, and fail the build if any of it is still in the product.
      # The input file orders this after Xcode copies the package's resource bundle into the app.
      - name: Strip GPL-derived LuxTTS data
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/FluidAudio_LuxTtsG2pResources.bundle
        script: |
          set -euo pipefail
          APP="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          find "$APP" -path "$APP/PlugIns/*.xctest" -prune -o -name '*LuxTtsG2pResources*.bundle' -prune -print -exec rm -rf {} +
          # Test bundles are embedded only in test builds and never ship.
          if find "$APP" -path "$APP/PlugIns/*.xctest" -prune -o -iname '*luxtts*' -print | grep -q .; then
            echo "error: GPL-derived LuxTTS data is still in $APP (see docs/design/kokoro-neural-voice.md)"
            exit 1
          fi
    dependencies:
      - target: VoiceCodeShareExtension
        embed: true
      - framework: Frameworks/BPHeadset.xcframework
        embed: true
      - package: FluidAudio
        product: FluidAudio

  VoiceCodeShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.5"
    sources:
      - path: VoiceCodeShareExtension
        excludes:
          - "*.md"
    resources:
      - VoiceCodeShareExtension/Base.lproj
    info:
      path: VoiceCodeShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Untethered
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionPointIdentifier: com.apple.share-services
    entitlements:
      path: VoiceCodeShareExtension/VoiceCodeShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.910labs.untethered.resources
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.910labs.voice-code
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.910labs.voice-code.ShareExtension
        INFOPLIST_FILE: VoiceCodeShareExtension/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  VoiceCodeMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    supportedDestinations:
      - macOS
    sources:
      - path: VoiceCode
        excludes:
          - "*.md"
          - "BridgingHeader.h"
          - "Managers/DeviceAudioSessionManager.swift"
          - "Managers/BlueParrottButtonManager.swift"
          - "Managers/BPSniffer.swift"
          - "Views/QRScannerView.swift"
    resources:
      - VoiceCode/Assets.xcassets
      - VoiceCode/VoiceCode.xcdatamodeld
    info:
      path: VoiceCodeMac/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Untethered
        CFBundleIconName: AppIcon
        NSMicrophoneUsageDescription: Untethered needs microphone access for voice input to control Claude.
        NSSpeechRecognitionUsageDescription: Untethered needs speech recognition to transcribe your voice commands.
        NSLocalNetworkUsageDescription: Untethered needs to connect to your backend server on your local network.
        NSBluetoothAlwaysUsageDescription: Untethered uses Bluetooth to connect to your BlueParrott headset for hands-free voice control.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - voicecode
            CFBundleURLName: dev.910labs.voice-code-mac
    entitlements:
      path: VoiceCodeMac/VoiceCodeMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.bluetooth: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.910labs.voice-code-mac
        PRODUCT_MODULE_NAME: VoiceCode
        INFOPLIST_FILE: VoiceCodeMac/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      # Same guard as the iOS target: FluidAudio's GPL-derived LuxTTS data must not ship.
      - name: Strip GPL-derived LuxTTS data
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/FluidAudio_LuxTtsG2pResources.bundle
        script: |
          set -euo pipefail
          APP="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          find "$APP" -name '*.xctest' -prune -o -name '*LuxTtsG2pResources*.bundle' -prune -print -exec rm -rf {} +
          # Test bundles are embedded only in test builds and never ship.
          if find "$APP" -name '*.xctest' -prune -o -iname '*luxtts*' -print | grep -q .; then
            echo "error: GPL-derived LuxTTS data is still in $APP (see docs/design/kokoro-neural-voice.md)"
            exit 1
          fi
    dependencies:
      - package: FluidAudio
        product: FluidAudio

  VoiceCodeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.5"
    sources:
      - path: VoiceCodeTests
        excludes:
          - "BlueParrottBLEManagerTests.swift"
          - "HeadsetRemoteCommandManagerMacTests.swift"
          - "HeadsetEarconPlayerTests.swift"
          - "MacAudioOutputRouterTests.swift"
    resources:
      - VoiceCodeTests/Fixtures
    dependencies:
      - target: VoiceCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.910labs.voice-codeTests
        GENERATE_INFOPLIST_FILE: YES

  VoiceCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - VoiceCodeUITests
    dependencies:
      - target: VoiceCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.910labs.voice-codeUITests
        GENERATE_INFOPLIST_FILE: YES

  VoiceCodeMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: VoiceCodeTests
        excludes:
          - "DeviceAudioSessionManagerTests.swift"
          - "VoiceOutputManagerTests.swift"
          - "CopyFeaturesTests.swift"
          - "SessionInfoViewTests.swift"
          - "QRScannerViewTests.swift"
          - "HeadsetRemoteCommandManagerIOSTests.swift"
          - "BlueParrottButtonManagerTests.swift"
    resources:
      - VoiceCodeTests/Fixtures
    dependencies:
      - target: VoiceCodeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.910labs.voice-code-macTests
        GENERATE_INFOPLIST_FILE: YES

  VoiceCodeMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - VoiceCodeMacUITests
    dependencies:
      - target: VoiceCodeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.910labs.voice-code-macUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VoiceCode:
    build:
      targets:
        VoiceCode: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: VoiceCodeTests
        - name: VoiceCodeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      customArchiveName: VoiceCode
      revealArchiveInOrganizer: true
      preActions: []
      postActions: []

  VoiceCodeMac:
    build:
      targets:
        VoiceCodeMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: VoiceCodeMacTests
        - name: VoiceCodeMacUITests
